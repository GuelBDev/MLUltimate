plugins {
    id 'java'
    id 'idea'
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

version = project.property('version')
group = project.property('group')
base {
    archivesName = project.property('archivesBaseName')
}

sourceSets {
    main {
        java {
            exclude '**/mixin/**'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'spongepowered'
        url = 'https://repo.spongepowered.org/maven/'
    }
    maven {
        name = 'mojang'
        url = 'https://libraries.minecraft.net/'
    }
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

dependencies {
    // Local Forge, Minecraft 1.8.9, LWJGL and LaunchWrapper libraries
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation fileTree(dir: 'libs', include: ['*.jar'])

    // Google GSON for JSON config serialization
    implementation 'com.google.code.gson:gson:2.8.9'
    testImplementation 'com.google.code.gson:gson:2.8.9'

    // Annotations
    compileOnly 'org.jetbrains:annotations:23.0.0'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
}

jar {
    archiveFileName = "${project.property('archivesBaseName')}.jar"
    manifest {
        attributes(
            'Manifest-Version': '1.0',
            'Created-By': 'MLUltimate Build System',
            'Main-Class': 'net.mlultimate.client.MLUltimate',
            'FMLCorePluginContainsFMLMod': 'true',
            'ForceLoadAsMod': 'true'
        )
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.property('minecraft_version')

    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': project.property('minecraft_version')
    }
}

tasks.register('setupDecompWorkspace') {
    group = 'MLUltimate'
    description = 'Prepares the Minecraft 1.8.9 workspace for MLUltimate Client development.'
    doLast {
        println "============================================================"
        println " MLUltimate Client 1.8.9 Workspace Configured Successfully! "
        println " Core Libraries: Forge 11.15.0.1656 / Minecraft 1.8.9       "
        println " Ready to build: ./gradlew build                           "
        println "============================================================"
    }
}
